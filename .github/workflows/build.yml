name: NeoForge TAB Bridge
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: tab-bridge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: chmod +x gradlew && ./gradlew build --no-daemon --max-workers=1 --console=plain
      - run: node src/test/node/server-smoke.mjs
        timeout-minutes: 10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OkoTabBridge-NeoForge
          path: |
            build/libs/*.jar
            build/test-results/test/
            build/smoke/server-output.log
