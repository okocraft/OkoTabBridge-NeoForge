plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
group='net.okocraft.tabbridge'
version='0.1.0'
base.archivesName='OkoTabBridge-NeoForge'
java.toolchain.languageVersion=JavaLanguageVersion.of(25)
repositories { mavenCentral(); maven { url='https://jitpack.io' } }
neoForge {
    version='26.2.0.88'
    mods { oko_tab_bridge { sourceSet sourceSets.main } }
}
dependencies {
    compileOnly 'com.github.NEZNAMY:TAB-API:6.1.2'
    implementation 'com.google.code.gson:gson:2.13.2'
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8' }
test { useJUnitPlatform(); testLogging { exceptionFormat='full' } }
processResources { inputs.property('version',project.version); filesMatching('META-INF/neoforge.mods.toml') { expand version:project.version } }
sourceSets { testmod { compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath; runtimeClasspath += output + compileClasspath } }
tasks.register('testmodJar',Jar) { from sourceSets.testmod.output; archiveFileName='oko-tab-test.jar'; destinationDirectory=layout.buildDirectory.dir('testmods') }
tasks.named('check') { dependsOn tasks.named('testmodJar') }

def tabFixture=layout.buildDirectory.file('test-dependencies/TAB.v6.2.1.jar')
def obtainTabFixture=tasks.register('obtainTabFixture') {
    outputs.file(tabFixture)
    doLast {
        def target=tabFixture.get().asFile
        target.parentFile.mkdirs()
        if (!target.exists()) {
            def connection=new URI('https://github.com/NEZNAMY/TAB/releases/download/6.2.1/TAB.v6.2.1.jar').toURL().openConnection()
            connection.connectTimeout=15000;connection.readTimeout=120000
            connection.inputStream.withCloseable { input -> target.withOutputStream { output -> output << input } }
        }
        def digest=java.security.MessageDigest.getInstance('SHA-256').digest(target.bytes).encodeHex().toString()
        if(digest!='0b6a21af6fd3b113c05821daaed00ff92234a84ca94b29b3aec0ef1bd313b8a9')
            throw new GradleException('TAB fixture differs from the official release digest')
    }
}
sourceSets.testmod.compileClasspath=files(tabFixture)+sourceSets.testmod.compileClasspath
tasks.named('compileTestmodJava') { dependsOn obtainTabFixture }
